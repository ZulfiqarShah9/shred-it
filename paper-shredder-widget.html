                                const sr = p.size * (1 + (1 - a) * 2);
                                const sg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sr);
                                sg.addColorStop(0, 'rgba(232,232,232,' + (a * 0.16) + ')');
                                sg.addColorStop(0.55, 'rgba(210,210,210,' + (a * 0.08) + ')');
                                sg.addColorStop(1, 'rgba(200,200,200,0)');
                                ctx.fillStyle = sg;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, sr, 0, Math.PI * 2);
                                ctx.fill();
                            } else {
                                ctx.globalCompositeOperation = 'lighter';
                                const r = p.size * (1 + (1 - a) * 1.4);
                                const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
                                g.addColorStop(0, 'rgba(255,252,205,' + (a * 0.95) + ')');
                                g.addColorStop(0.28, 'rgba(255,180,45,' + (a * 0.8) + ')');
                                g.addColorStop(0.62, 'rgba(240,80,12,' + (a * 0.38) + ')');
                                g.addColorStop(1, 'rgba(150,25,0,0)');
                                ctx.fillStyle = g;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                        ctx.globalCompositeOperation = 'source-over';
                        if (t < burnDuration + 650) requestAnimationFrame(step); else finish();
                    }
                    requestAnimationFrame(step);
                });

                Array.from(el.binPile.children).forEach(function(strip) {
                    const sx = parseFloat(strip.style.left) || 0;
                    const sw = parseFloat(strip.style.width) || 5;
                    const center = pileLeft + sx + sw / 2;
                    const distance = Math.abs(center - midX);
                    const progress = Math.max(0, Math.min(1, distance / (binRect.width / 2)));
                    const delay = progress * burnDuration * 0.82;
                    const duration = 340 + Math.random() * 220;
                    const base = strip.style.transform || '';
                    strip.animate([
                        { opacity: 1, filter: 'brightness(1)', transform: base },
                        { opacity: 1, filter: 'brightness(2.3) sepia(1) saturate(9) hue-rotate(-18deg)', transform: base + ' scale(1.08)', offset: 0.2 },
                        { opacity: 0.85, filter: 'brightness(0.25) sepia(1) saturate(5)', transform: base + ' scale(0.7)', offset: 0.62 },
                        { opacity: 0, filter: 'brightness(0.1)', transform: base + ' scale(0.15) translateY(-10px)' }
                    ], { duration: duration, delay: delay, easing: 'ease-in', fill: 'forwards' });
                    const smokeTimer = setTimeout(() => emitSmoke(center, 2), delay + 160);
                    stripTimers.add(smokeTimer);
                });

                await runFire();
                el.binPile.innerHTML = '';
                el.burnLayer.innerHTML = '';
                ctx.clearRect(0, 0, binRect.width, binRect.height);
                el.bin.classList.remove('burning');
                for (let wave = 0; wave < 5; wave++) {
                    emitSmoke(20 + Math.random() * (binRect.width - 40), 4);
                    await sleep(380);
                }
                await sleep(700);
                el.smokeLayer.innerHTML = '';
                stopBurnSound();

                if (window.electronAPI && electronAPI.burnBin) await electronAPI.burnBin();
                state.shreddedCount = 0; el.shreddedCount.textContent = '0'; updateBinFill();
                state.isBurning = false;
                el.emptyBtn.disabled = false;
                updateStatus('Bin emptied', 'ready');
                setTimeout(() => updateStatus('Ready - Drop files', 'ready'), 1500);
            }

            // Drag & Drop
            function onDragOver(e) { e.preventDefault(); e.stopPropagation();
                el.dropOverlay.classList.add('active');
                el.feedSlot.style.boxShadow = '0 0 30px rgba(212,168,67,0.4), inset 0 5px 10px rgba(0,0,0,0.95)'; }
            function onDragLeave(e) { e.preventDefault(); e.stopPropagation();
                if (!el.widgetContainer.contains(e.relatedTarget)) {
                    el.dropOverlay.classList.remove('active'); el.feedSlot.style.boxShadow = ''; }}
            function onDrop(e) { e.preventDefault(); e.stopPropagation();
                el.dropOverlay.classList.remove('active'); el.feedSlot.style.boxShadow = '';
                onFilesDropped(Array.from(e.dataTransfer.files)); }

            function filesFromPaths(paths) {
                return paths.map(p => {
                    const name = p.split(/[\\/]/).pop() || p;
                    return {
                        path: p,
                        name: name,
                        type: /\.[a-z0-9]+$/i.test(name) ? '' : 'httpd/unix-directory',
                        size: 0
                    };
                });
            }

            function pickFiles() {
                if (window.electronAPI && typeof electronAPI.selectFiles === 'function') {
                    electronAPI.selectFiles().then(function(paths) {
                        if (paths && paths.length) onFilesDropped(filesFromPaths(paths));
                    }).catch(function() {});
                } else {
                    el.fileInput.click();
                }
            }

            function initTheme() {
                const key = 'paper-shredder-theme';
                const media = window.matchMedia('(prefers-color-scheme: light)');
                const stored = () => { try { return localStorage.getItem(key); } catch (e) { return null; } };
                const apply = mode => {
                    const theme = mode === 'auto' ? (media.matches ? 'light' : 'dark') : mode;
                    document.documentElement.dataset.theme = theme;
                    el.themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
                    el.themeBtn.title = theme === 'dark' ? 'Light theme (double-click: system)' : 'Dark theme (double-click: system)';
                };
                apply(stored() || 'auto');
                if (media.addEventListener) media.addEventListener('change', () => { if (!stored() || stored() === 'auto') apply('auto'); });
                el.themeBtn.onclick = e => {
                    e.stopPropagation();
                    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                    try { localStorage.setItem(key, next); } catch (err) {}
                    apply(next);
                };
                el.themeBtn.ondblclick = e => {
                    e.stopPropagation();
                    try { localStorage.removeItem(key); } catch (err) {}
                    apply('auto');
                };
            }

            function setupControls() {
                el.closeBtn.onclick = e => { e.stopPropagation(); electronAPI.closeWindow?.(); el.widgetContainer.style.display = 'none'; };
                el.minimizeBtn.onclick = e => { e.stopPropagation(); electronAPI.minimizeWindow?.(); el.widgetContainer.style.transform = 'scale(0.9)'; setTimeout(() => el.widgetContainer.style.display = 'none', 150); };
                el.settingsBtn.onclick = e => { e.stopPropagation(); showSettings(); };
                el.emptyBtn.onclick = e => { e.stopPropagation(); emptyBin(); };
                el.soundBtn.onclick = e => {
                    e.stopPropagation();
                    state.settings.soundEnabled = !state.settings.soundEnabled;
                    try { localStorage.setItem('paper-shredder-sound', state.settings.soundEnabled ? 'on' : 'off'); } catch (err) {}
                    if (!state.settings.soundEnabled) { stopShredSound(); stopBurnSound(); } else unlockAudio();
                    updateFeedbackButtons();
                };
                el.pickBtn.onclick = e => { e.stopPropagation(); pickFiles(); };
                el.fileInput.onchange = e => {
                    if (e.target.files && e.target.files.length) onFilesDropped(Array.from(e.target.files));
                    el.fileInput.value = '';
                };

                electronAPI.onTriggerFileSelect?.(async () => {
                    const paths = await electronAPI.selectFiles();
                    if (paths && paths.length) onFilesDropped(filesFromPaths(paths));
                });
                electronAPI.onShredFilePath?.(p => onFilesDropped(filesFromPaths([p])));
                electronAPI.onEmptyBin?.(emptyBin);
                electronAPI.onShowSettings?.(showSettings);
                electronAPI.onShowInfo?.(showInfo);
            }

            function showInfo() {
                const m = document.createElement('div');
                m.className = 'modal';
                m.innerHTML = '<div class="modal-box" style="max-height:86vh;overflow:auto">' +
                    '<h3>How Shred-it works</h3>' +
                    '<div style="font-size:12px;line-height:1.6;color:var(--text-secondary);margin-bottom:18px">' +
                    '<p style="margin-bottom:10px"><b style="color:var(--text-primary)">Shred</b> &mdash; the file is moved out of its folder into the private Shredder Bin. You can restore it from the tray menu.</p>' +
                    '<p style="margin-bottom:10px"><b style="color:var(--text-primary)">Burn / Empty bin</b> &mdash; files in the bin are overwritten and <b style="color:var(--danger-red)">permanently removed from your system</b>. This cannot be undone.</p>' +
                    '<p style="margin-bottom:10px"><b style="color:var(--text-primary)">Delete from this tool</b> &mdash; means that same permanent burn. No extra confirmation will be asked.</p>' +
                    '<p>Use the tray menu to show or hide the widget, restore files, or read this information again.</p>' +
                    '</div>' +
                    '<div class="btn-group"><button class="btn-save" id="infoOk">Got it</button></div>' +
                    '</div>';
                document.body.appendChild(m);
                requestAnimationFrame(() => m.classList.add('visible'));
                const cleanup = () => {
                    m.classList.remove('visible');
                    setTimeout(() => m.remove(), 200);
                    try { localStorage.setItem('paper-shredder-info-seen', '1'); } catch (err) {}
                };
                m.querySelector('#infoOk').onclick = cleanup;
                m.onclick = e => { if (e.target === m) cleanup(); };
            }

            function showSettings() {
                const m = document.createElement('div');
                m.className = 'modal';
                m.innerHTML = `<div class="modal-box">
                    <h3>Shredder Settings</h3>
                    <label><span>Shred Speed</span><select id="shredSpeed"><option value="0.7">Slow (Secure)</option><option value="1" selected>Normal</option><option value="1.5">Fast</option></select></label>
                    <label><span>Secure Delete (Overwrite)</span><input type="checkbox" id="secureDelete" checked></label>
                    <label><span>Auto-empty bin when full</span><input type="checkbox" id="autoEmpty"></label>
                    <label><span>Bin Capacity</span><input type="number" id="binCapacity" value="100" min="20" max="500"></label>
                    <div class="btn-group"><button class="btn-cancel" id="cancelSettings">Cancel</button><button class="btn-save" id="saveSettings">Save</button></div>
                </div>`;
                document.body.appendChild(m);
                requestAnimationFrame(() => m.classList.add('visible'));
                document.getElementById('shredSpeed').value = state.settings.shredSpeed;
                document.getElementById('secureDelete').checked = state.settings.secureDelete;
                document.getElementById('autoEmpty').checked = state.settings.autoEmpty;
                document.getElementById('binCapacity').value = state.settings.maxBinCapacity;
                const cleanup = () => { m.classList.remove('visible'); setTimeout(() => m.remove(), 200); };
                m.querySelector('#cancelSettings').onclick = cleanup;
                m.querySelector('#saveSettings').onclick = () => {
                    state.settings.shredSpeed = parseFloat(document.getElementById('shredSpeed').value);
                    state.settings.secureDelete = document.getElementById('secureDelete').checked;
                    state.settings.autoEmpty = document.getElementById('autoEmpty').checked;
                    state.settings.maxBinCapacity = parseInt(document.getElementById('binCapacity').value);
                    if (window.electronAPI && electronAPI.setSecureDelete) electronAPI.setSecureDelete(state.settings.secureDelete);
                    if (state.settings.autoEmpty && state.shreddedCount >= state.settings.maxBinCapacity) emptyBin();
                    cleanup(); updateBinFill();
                };
                m.onclick = e => { if (e.target === m) cleanup(); };
            }

            function init() {
                let soundOn = true, vibrationOn = true;
                try {
                    soundOn = localStorage.getItem('paper-shredder-sound') !== 'off';
                    vibrationOn = localStorage.getItem('paper-shredder-vibration') !== 'off';
                } catch (e) {}
                state.settings = {
                    shredSpeed: 1, secureDelete: true, autoEmpty: false, maxBinCapacity: 100,
                    soundEnabled: soundOn, vibrationEnabled: vibrationOn
                };
                initTheme();
                buildCutLines();
                setupControls();
                updateFeedbackButtons();
                el.widgetContainer.addEventListener('dragover', onDragOver);
                el.widgetContainer.addEventListener('dragleave', onDragLeave);
                el.widgetContainer.addEventListener('drop', onDrop);
                document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll('.modal.visible').forEach(m => { m.classList.remove('visible'); setTimeout(() => m.remove(), 200); }); }});
                document.addEventListener('dragover', e => e.preventDefault());
                document.addEventListener('drop', e => e.preventDefault());
                updateBinFill();
                if (window.electronAPI && electronAPI.setSecureDelete) electronAPI.setSecureDelete(state.settings.secureDelete);
                if (window.electronAPI && electronAPI.getBin) {
                    electronAPI.getBin().then(function(entries) {
                        if (!entries || !entries.length) return;
                        state.shreddedCount = entries.length;
                        el.shreddedCount.textContent = String(entries.length);
                        updateBinFill();
                        setTimeout(function() {
                            const fake = { name: 'shredded.txt', type: 'text/plain' };
                            const preview = createPreview(fake, 'text', getFileColor(fake), null);
                            for (let i = 0; i < Math.min(entries.length, 12); i++) addInstantPile(preview, getGeometry());
                        }, 250);
                    }).catch(function() {});
                }
                let infoSeen = false;
                try { infoSeen = localStorage.getItem('paper-shredder-info-seen') === '1'; } catch (e) {}
                if (!infoSeen) setTimeout(showInfo, 500);
                console.log('Paper Shredder Widget initialized - continuous feed + falling shreds');
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
        })();
    </script>
</body>
</html>
